[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "Support ticket agent with trajectory evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rakesh Saraswat" }]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "mcp>=1.12,<2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
opensearch = ["opensearch-py>=2.6"]
pgvector = ["pgvector>=0.3"]
voice = ["faster-whisper>=1.0"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]
langsmith = ["langsmith>=0.1"]
dev = ["pytest>=8.2", "ruff==0.17.3"]
all = ["relay[openai,anthropic,opensearch,pgvector,otlp,langsmith]"]

[tool.setuptools.packages.find]
include = ["relay*", "evals*"]

[tool.setuptools.package-data]
relay = ["fixtures/*.jsonl", "db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: needs a reachable Postgres (RELAY_TEST_DATABASE_URL)",
    "pgvector: needs Postgres with the vector extension",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM905"]
